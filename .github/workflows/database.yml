name: Database

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  migrations-and-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild schema and test RLS
        run: bash scripts/test-database.sh
