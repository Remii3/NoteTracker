<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#267e73" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sylabio" />
    <meta
      name="description"
      content="Sylabio łączy notatki, plan egzaminu i inteligentne powtórki."
    />
    <script>
      (() => {
        try {
          const storedTheme = localStorage.getItem("notetracker-theme");
          const isDark =
            storedTheme === "dark" ||
            (storedTheme !== "light" &&
              matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.dataset.theme = isDark ? "dark" : "light";
          document.documentElement.style.colorScheme = isDark
            ? "dark"
            : "light";
        } catch {
          // ThemeProvider applies the fallback once the application starts.
        }
      })();
    </script>
    <title>Sylabio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
